apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-lab-config
  namespace: operations-lab
data:
  APP_MESSAGE: "Learning to operate a resilient service"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-lab
  namespace: operations-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: operations-lab
  template:
    metadata:
      labels:
        app: operations-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: operations-lab
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: operations-lab:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: v1
          envFrom:
            - configMapRef:
                name: operations-lab-config
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(5)"]
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: operations-lab
  namespace: operations-lab
spec:
  type: ClusterIP
  selector:
    app: operations-lab
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: operations-lab
  namespace: operations-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: operations-lab
